<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123B5D"/>
      <stop offset="60%" stop-color="#19639E"/>
      <stop offset="100%" stop-color="#2196E8"/>
    </linearGradient>

    <!-- Bridge Arch Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#60B5F5"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2196E8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base App Tile / Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" filter="url(#subtleGlow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="7" y="7" width="106" height="106" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Golden Rising Sun / Nexus of Opportunity behind Bridge -->
  <circle cx="60" cy="50" r="14" fill="url(#goldGrad)" opacity="0.95"/>
  <circle cx="60" cy="50" r="20" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Architectural Suspension Cables -->
  <path d="M 34 76 L 60 48" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M 44 76 L 60 48" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M 54 76 L 60 48" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <path d="M 86 76 L 60 48" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M 76 76 L 60 48" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M 66 76 L 60 48" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- The Grand Bridge Arch ("Setu") -->
  <path d="M 22 78 C 36 50, 84 50, 98 78" 
        stroke="url(#bridgeGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        fill="none"/>

  <!-- Road Deck / Foundation -->
  <path d="M 20 78 L 100 78" 
        stroke="#FFFFFF" 
        stroke-width="4.5" 
        stroke-linecap="round"/>
        
  <!-- Center Deck Keystone Marker (Workforce Hub) -->
  <circle cx="60" cy="78" r="4.5" fill="#F59E0B"/>
  <circle cx="60" cy="78" r="2" fill="#FFFFFF"/>

  <!-- Bridge Pillars -->
  <path d="M 32 78 L 32 88" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M 88 78 L 88 88" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <!-- Bottom Reflective River / Dynamic Wave ("Kaam Connection") -->
  <path d="M 26 92 C 40 88, 52 94, 60 91 C 68 88, 80 94, 94 92" 
        stroke="#60B5F5" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.75"/>
</svg>
