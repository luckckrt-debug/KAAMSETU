<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dwBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="55%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="dwAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Core Glow -->
    <filter id="dwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- App Tile / Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#dwBgGrad)" filter="url(#dwGlow)"/>
  <rect x="7" y="7" width="106" height="106" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Geometric Interconnected DW Monogram -->
  <!-- Stylized D arc with digital node bridges -->
  <path d="M 32 30 L 56 30 C 74 30, 88 42, 88 60 C 88 78, 74 90, 56 90 L 32 90 Z" 
        stroke="url(#dwAccentGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none" 
        opacity="0.95"/>

  <!-- Internal W chevron dynamic network -->
  <path d="M 42 42 L 52 74 L 62 52 L 72 74 L 82 42" 
        stroke="#FFFFFF" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none" />

  <!-- Digital Network Connection Nodes -->
  <circle cx="52" cy="74" r="3.5" fill="#38BDF8"/>
  <circle cx="62" cy="52" r="3.5" fill="#38BDF8"/>
  <circle cx="72" cy="74" r="3.5" fill="#38BDF8"/>
  <circle cx="62" cy="30" r="4" fill="#38BDF8"/>
  <circle cx="62" cy="30" r="2" fill="#FFFFFF"/>
</svg>
