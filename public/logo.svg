<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123B5D"/>
      <stop offset="60%" stop-color="#19639E"/>
      <stop offset="100%" stop-color="#2196E8"/>
    </linearGradient>

    <!-- Bridge Arch Gradient -->
    <linearGradient id="logoBridgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#60B5F5"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2196E8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Group: Emblem (70x70) -->
  <g transform="translate(6, 5)">
    <!-- Base App Tile / Squircle -->
    <rect x="0" y="0" width="70" height="70" rx="20" fill="url(#logoBgGrad)" filter="url(#logoShadow)"/>
    <rect x="0.8" y="0.8" width="68.4" height="68.4" rx="19.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

    <!-- Golden Rising Sun -->
    <circle cx="35" cy="30" r="9" fill="url(#logoGoldGrad)" opacity="0.95"/>
    <circle cx="35" cy="30" r="13" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.6"/>

    <!-- Suspension Cables -->
    <path d="M 20 48 L 35 29" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <path d="M 26 48 L 35 29" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
    <path d="M 32 48 L 35 29" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
    
    <path d="M 50 48 L 35 29" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <path d="M 44 48 L 35 29" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
    <path d="M 38 48 L 35 29" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>

    <!-- Bridge Arch ("Setu") -->
    <path d="M 14 49 C 22 31, 48 31, 56 49" stroke="url(#logoBridgeGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Road Deck -->
    <path d="M 12 49 L 58 49" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="35" cy="49" r="3" fill="#F59E0B"/>
    <circle cx="35" cy="49" r="1.3" fill="#FFFFFF"/>

    <!-- Bridge Pillars -->
    <path d="M 20 49 L 20 56" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
    <path d="M 50 49 L 50 56" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>

    <!-- Bottom Wave -->
    <path d="M 16 59 C 24 57, 30 61, 35 59 C 40 57, 46 61, 54 59" stroke="#60B5F5" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <g transform="translate(90, 44)">
    <!-- KAAM -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#000000" letter-spacing="-0.5">KAAM</text>
    
    <!-- SETU -->
    <text x="86" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#2196E8" letter-spacing="-0.5">SETU</text>
    
    <!-- Gold Dot separator -->
    <circle cx="164" cy="-8" r="3" fill="#F59E0B"/>

    <!-- Subtitle / Tagline -->
    <text x="1" y="18" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" fill="#000000" letter-spacing="2.5">काम सेतु • WORKFORCE PLATFORM</text>
  </g>
</svg>
