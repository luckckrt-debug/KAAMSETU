<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dwLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="55%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="dwLogoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <filter id="dwLogoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Icon (68x68) -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="68" height="68" rx="18" fill="url(#dwLogoBg)" filter="url(#dwLogoShadow)"/>
    <rect x="1" y="1" width="66" height="66" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

    <!-- Stylized D Outer Track -->
    <path d="M 18 18 L 33 18 C 45 18, 54 25, 54 34 C 54 43, 45 50, 33 50 L 18 50 Z" 
          stroke="url(#dwLogoAccent)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>

    <!-- Dynamic W Chevron Infill -->
    <path d="M 23 25 L 29 42 L 35 30 L 41 42 L 47 25" 
          stroke="#FFFFFF" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>

    <!-- Connection Nodes -->
    <circle cx="29" cy="42" r="2.2" fill="#38BDF8"/>
    <circle cx="35" cy="30" r="2.2" fill="#38BDF8"/>
    <circle cx="41" cy="42" r="2.2" fill="#38BDF8"/>
    <circle cx="35" cy="18" r="2.5" fill="#38BDF8"/>
    <circle cx="35" cy="18" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <g transform="translate(86, 44)">
    <!-- DIGI -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="900" fill="#0B1F3A" letter-spacing="-0.5">Digi</text>
    
    <!-- WORK -->
    <text x="64" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="900" fill="#2563EB" letter-spacing="-0.5">Work</text>
    
    <!-- Sky Blue Accent Node -->
    <circle cx="145" cy="-8" r="3.5" fill="#38BDF8"/>

    <!-- Tagline -->
    <text x="1" y="18" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#4B6F8E" letter-spacing="2">DIGITAL WORKFORCE PLATFORM</text>
  </g>
</svg>
